<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recuperar Senha — GVP BOT</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
</head>
<body class="auth-page">
  <div class="auth-bg">
    <div class="auth-orb orb-1"></div>
    <div class="auth-orb orb-2"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="auth-container">
    <div class="auth-card">
      <a href="index.html" class="auth-logo">
        <svg width="40" height="40" viewBox="0 0 32 32" fill="none">
          <defs><linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#3B82F6"/><stop offset="100%" style="stop-color:#8B5CF6"/></linearGradient></defs>
          <rect width="32" height="32" rx="8" fill="url(#lg)"/>
          <path d="M8 10h16M8 16h10M8 22h13" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="24" cy="22" r="4" fill="#22C55E"/>
        </svg>
        <span class="logo-text">GVP<span class="logo-accent">BOT</span></span>
      </a>

      <!-- STEP 1: Solicitar -->
      <div id="step-email">
        <h1 class="auth-title">Recuperar senha</h1>
        <p class="auth-subtitle">Digite seu e-mail para receber o link de recuperação</p>
        <div class="auth-form">
          <div class="form-group">
            <label>E-mail</label>
            <div class="input-wrapper">
              <span class="input-icon">✉️</span>
              <input type="email" id="rec-email" placeholder="seu@email.com" autocomplete="email"/>
            </div>
            <span class="field-error" id="rec-error"></span>
          </div>
          <div class="form-error" id="rec-form-error"></div>
          <button class="btn-submit" id="rec-btn" onclick="enviarRecuperacao()">
            <span id="rec-btn-text">Enviar link de recuperação</span>
          </button>
        </div>
      </div>

      <!-- STEP 2: Confirmação -->
      <div id="step-ok" style="display:none;text-align:center;padding:1rem 0">
        <div style="font-size:3rem;margin-bottom:1rem">📧</div>
        <h2 style="font-size:1.3rem;font-weight:700;margin-bottom:.5rem">E-mail enviado!</h2>
        <p style="color:#64748B;font-size:.9rem;line-height:1.6">Verifique sua caixa de entrada e clique no link para criar uma nova senha.</p>
        <p style="color:#64748B;font-size:.8rem;margin-top:.8rem">Não recebeu? Verifique o spam ou <button onclick="voltarStep()" style="background:none;border:none;color:#3B82F6;cursor:pointer;font-size:.8rem">tente novamente</button></p>
      </div>

      <p class="auth-footer-text" style="margin-top:1.5rem">
        <a href="login.html">← Voltar para o login</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script>
    async function enviarRecuperacao() {
      const email = document.getElementById('rec-email').value.trim();
      const err   = document.getElementById('rec-error');
      const ferr  = document.getElementById('rec-form-error');
      const btn   = document.getElementById('rec-btn');
      const txt   = document.getElementById('rec-btn-text');

      err.textContent  = '';
      ferr.textContent = '';

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        err.textContent = 'Digite um e-mail válido';
        return;
      }

      btn.disabled = true;
      txt.textContent = '⏳ Enviando...';

      try {
        const { error } = await _sb.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + '/configuracoes.html'
        });
        if (error) throw error;
        document.getElementById('step-email').style.display = 'none';
        document.getElementById('step-ok').style.display    = 'block';
      } catch(e) {
        ferr.textContent = 'Erro ao enviar: ' + e.message;
        btn.disabled = false;
        txt.textContent = 'Enviar link de recuperação';
      }
    }

    function voltarStep() {
      document.getElementById('step-email').style.display = 'block';
      document.getElementById('step-ok').style.display    = 'none';
      document.getElementById('rec-email').value = '';
    }
  </script>
</body>
</html>
